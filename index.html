<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENS - Salon Stylizacji Paznokci</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #c1633e;
            --primary-dark: #a04e30;
            --secondary: #f2e6d5;
            --accent-green: #7c8c5f;
            --accent-green-light: #e6ebdd;
            --accent-ochre: #c99a3f;
            --accent-ochre-light: #f5ead0;
            --dark: #333333;
            --light: #ffffff;
            --text: #4a4a4a;
            --line: rgba(51,51,51,0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            color: var(--text);
            line-height: 1.6;
            background-color: var(--light);
            padding-top: 80px;
        }

        h1, h2, h3, h4 {
            font-family: 'Playfair Display', serif;
        }

        a { text-decoration: none; color: inherit; }
        button { font-family: inherit; }

        nav {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 80px;
            background: var(--light);
            padding: 0 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
            z-index: 1000;
            transition: all 0.3s ease;
        }

        nav.scrolled { height: 70px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }

        .logo { font-size: 1.8rem; font-weight: 600; color: var(--primary); }

        .nav-links { display: flex; list-style: none; gap: 2rem; align-items: center; }

        .nav-links a { font-weight: 400; font-size: 0.95rem; transition: color 0.3s ease; }
        .nav-links a:hover { color: var(--primary); }
        .nav-links a.active { color: var(--primary-dark); font-weight: 600; }

        .nav-links .btn-book {
            background: var(--primary);
            color: var(--light);
            padding: 0.6rem 1.5rem;
            border-radius: 25px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            transition: background 0.3s ease;
            display: inline-block;
        }
        .nav-links .btn-book:hover { background: var(--primary-dark); color: var(--light); }

        .hero {
            min-height: calc(100vh - 80px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(rgba(242, 230, 213, 0.85), rgba(255, 255, 255, 0.9)), url('https://images.unsplash.com/photo-1522337660859-02fbefca4702?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
            padding: 2rem;
        }

        .hero h1 { font-size: 4.5rem; color: var(--dark); margin-bottom: 1.5rem; line-height: 1.1; }
        .hero p { font-size: 1.2rem; max-width: 600px; margin-bottom: 2.5rem; color: #555; }

        .hero-btns { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }

        .btn {
            display: inline-block;
            padding: 1rem 2.5rem;
            border-radius: 30px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-primary { background: var(--dark); color: var(--light); }
        .btn-primary:hover { background: var(--primary); transform: translateY(-2px); }

        .btn-outline { background: transparent; border: 2px solid var(--dark); color: var(--dark); }
        .btn-outline:hover { background: var(--dark); color: var(--light); transform: translateY(-2px); }

        @media (max-width: 768px) {
            .nav-links { display: none; }
            .hero h1 { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <nav id="navbar">
        <a href="index.html" class="logo">SENS.</a>
        <ul class="nav-links">
            <li><a href="index.html#hero" class="active">Start</a></li>
            <li><a href="onas.html">O nas</a></li>
            <li><a href="inwa.html">Zarządzanie</a></li>
            <li><a href="rezerwacje.html" class="btn-book">Umów wizytę</a></li>
        </ul>
    </nav>

    <header id="hero" class="hero">
        <h1>Twoje dłonie<br>w najlepszych rękach</h1>
        <p>Odkryj profesjonalną stylizację paznokci. Zadbamy o Twój wygląd, relaks i perfekcyjny detal podczas każdej wizyty.</p>
        <div class="hero-btns">
            <a href="rezerwacje.html" class="btn btn-primary">Zarezerwuj termin</a>
        </div>
    </header>

    <script>
        /* Efekt zmniejszenia navbara podczas przewijania */
        document.addEventListener('DOMContentLoaded', () => {
            const navbar = document.getElementById('navbar');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 50) navbar.classList.add('scrolled');
                else navbar.classList.remove('scrolled');
            });
        });
    </script>
</body>
</html>
